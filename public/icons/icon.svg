<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e293b"/>
      <stop offset="100%" style="stop-color:#0f172a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#818cf8"/>
      <stop offset="100%" style="stop-color:#6366f1"/>
    </linearGradient>
  </defs>

  <!-- Background rounded rectangle -->
  <rect width="512" height="512" rx="96" ry="96" fill="url(#bg)"/>

  <!-- Stylized S letterform -->
  <path d="M 296 148
           C 296 148, 248 112, 196 128
           C 144 144, 132 188, 156 220
           C 180 252, 248 264, 280 288
           C 312 312, 316 348, 284 372
           C 252 396, 200 380, 188 368"
        fill="none"
        stroke="url(#accent)"
        stroke-width="36"
        stroke-linecap="round"
        stroke-linejoin="round"/>

  <!-- Pen / signature stroke extending from the S tail -->
  <path d="M 188 368
           C 188 368, 260 400, 340 356"
        fill="none"
        stroke="url(#accent)"
        stroke-width="20"
        stroke-linecap="round"
        stroke-dasharray="4 0"/>

  <!-- Pen nib / dot at the end -->
  <circle cx="340" cy="356" r="12" fill="#818cf8"/>

  <!-- Small decorative signature line below -->
  <line x1="160" y1="416" x2="352" y2="416"
        stroke="#475569"
        stroke-width="4"
        stroke-linecap="round"
        stroke-dasharray="8 6"/>
</svg>
